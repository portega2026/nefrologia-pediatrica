<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nefrología Pediátrica · Base de Conocimiento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,300;0,400;0,600;0,700;0,800;0,900;1,300;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg-0:#141412;
  --bg-1:#1c1c1a;
  --panel:#2A2A29;
  --panel-2:#323230;
  --glass:rgba(255,255,255,.04);
  --glass-2:rgba(255,255,255,.08);
  --border:rgba(255,255,255,.1);
  --border-2:rgba(255,255,255,.18);
  --text:#ECF7FD;
  --text-2:#a8bcc8;
  --text-3:#607080;
  --accent:#13D511;
  --accent-2:#0fa80e;
  --accent-soft:#7fee7d;
  --accent-glow:rgba(19,213,17,.22);
  --coral:#ff7d63;
  --amber:#f3b34d;
  --font:'Exo 2',system-ui,sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,monospace;
  --sidebar-w:300px;
  --nav-h:76px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:var(--font);
  background:var(--bg-0);
  color:var(--text-2);
  -webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;
  min-height:100vh;overflow-x:hidden;
}

/* ── progress bar ── */
#prog{position:fixed;top:0;left:0;height:3px;width:0%;background:linear-gradient(90deg,var(--accent),var(--accent-soft));z-index:200;transition:width .1s linear;pointer-events:none}

/* ── nav ── */
.topnav{
  height:var(--nav-h);background:var(--panel);
  border-bottom:1px solid rgba(255,255,255,.09);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 28px;position:sticky;top:0;z-index:100;flex-shrink:0;
}
.nav-brand{display:flex;align-items:center;gap:13px;cursor:pointer;text-decoration:none}
.nav-glyph{
  width:44px;height:44px;border-radius:12px;flex-shrink:0;
  background:linear-gradient(145deg,rgba(19,213,17,.18),rgba(19,213,17,.05));
  border:1px solid rgba(19,213,17,.3);
  display:grid;place-items:center;
  box-shadow:0 0 24px rgba(19,213,17,.14);
}
.nav-glyph svg{width:26px;height:26px}
.nav-title{font-weight:800;font-size:1.12rem;color:var(--text);letter-spacing:-.02em;line-height:1.1}
.nav-sub{font-size:.54rem;text-transform:uppercase;letter-spacing:.26em;color:var(--accent);font-weight:700;margin-top:3px}
.nav-links{display:flex;align-items:center;gap:32px}
.nav-link{
  font-size:.95rem;font-weight:600;color:var(--text);cursor:pointer;
  background:none;border:none;font-family:var(--font);
  letter-spacing:.02em;transition:color .2s;padding:0;
}
.nav-link:hover{color:var(--accent)}
.nav-mobile-btn{
  display:none;background:var(--glass-2);border:1px solid var(--border);
  border-radius:10px;width:42px;height:42px;color:var(--text);cursor:pointer;place-items:center;
}

/* ── layout ── */
.page-body{display:flex;flex:1;min-height:0}

/* ── sidebar ── */
.sidebar{
  width:var(--sidebar-w);flex-shrink:0;
  height:calc(100vh - var(--nav-h));position:sticky;top:var(--nav-h);
  z-index:40;background:linear-gradient(180deg,var(--panel),var(--bg-1));
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;
}
.search-wrap{padding:16px 14px 8px}
.search-box{position:relative;display:flex;align-items:center}
.search-box svg{position:absolute;left:12px;width:14px;height:14px;color:var(--text-3)}
#search{
  width:100%;font-family:var(--font);font-size:.855rem;font-weight:500;color:var(--text);
  padding:10px 14px 10px 36px;border-radius:10px;border:1px solid var(--border);
  background:var(--glass);outline:none;transition:.2s;letter-spacing:.02em;
}
#search::placeholder{color:var(--text-3)}
#search:focus{border-color:var(--accent);background:var(--glass-2);box-shadow:0 0 0 3px var(--accent-glow)}
.sidebar-label{padding:8px 16px 4px;font-size:.58rem;font-weight:700;text-transform:uppercase;letter-spacing:.22em;color:var(--text-3)}

.tree{flex:1;overflow-y:auto;padding:4px 8px 28px}
.tree::-webkit-scrollbar{width:5px}
.tree::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:5px}
.tree::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.2)}

ul.branch{list-style:none}
ul.branch ul.branch{
  margin-left:11px;border-left:1px solid var(--border);padding-left:3px;
  overflow:hidden;max-height:0;opacity:0;
  transition:max-height .36s ease,opacity .28s ease;
}
li.node.open>ul.branch{max-height:3000px;opacity:1}

.row{
  display:flex;align-items:center;gap:6px;font-size:.855rem;font-weight:500;
  color:var(--text-2);padding:9px 10px;margin:2px 0;border-radius:10px;
  cursor:pointer;position:relative;transition:background .16s,color .16s;border:1px solid transparent;
}
.row:hover{background:var(--glass);color:var(--text)}
.row.active{
  background:linear-gradient(100deg,rgba(19,213,17,.13),rgba(19,213,17,.02));
  color:var(--text);border-color:rgba(19,213,17,.3);
  box-shadow:0 0 20px -8px var(--accent-glow);
  animation:pulse-border 2.5s ease-in-out infinite;
}
@keyframes pulse-border{
  0%,100%{box-shadow:0 0 20px -8px var(--accent-glow)}
  50%{box-shadow:0 0 30px -4px var(--accent-glow)}
}
.row.active::before{
  content:"";position:absolute;left:-1px;top:20%;bottom:20%;width:3px;border-radius:3px;
  background:linear-gradient(var(--accent),var(--accent-2));
}
.row .caret{width:15px;height:15px;flex-shrink:0;display:grid;place-items:center;transition:transform .26s cubic-bezier(.4,0,.2,1);color:var(--text-3)}
li.node.open>.row .caret{transform:rotate(90deg);color:var(--accent)}
.row .caret.leaf{visibility:hidden}
.row .label{flex:1;line-height:1.32}
.row .badge{font-size:.57rem;font-weight:700;background:rgba(19,213,17,.1);color:var(--accent-soft);border-radius:20px;padding:2px 8px;border:1px solid rgba(19,213,17,.2)}
.row .dot{width:4px;height:4px;border-radius:50%;background:var(--accent);margin-right:2px;flex-shrink:0;opacity:.5}
.row.hidden,li.node.hidden{display:none}
li.node{opacity:0;transform:translateX(-8px);animation:nodeIn .4s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes nodeIn{to{opacity:1;transform:none}}

/* ── main ── */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.content-scroll{flex:1;overflow-y:auto}

/* ── HOME view ── */
.home-wrap{min-height:calc(100vh - var(--nav-h));display:flex;flex-direction:column}

.home-hero{
  background:linear-gradient(160deg,#1a1a18 0%,#1e241a 40%,#141412 100%);
  border-bottom:1px solid var(--border);
  padding:80px 56px 72px;
  position:relative;overflow:hidden;
}
.home-hero::before{
  content:"";position:absolute;inset:0;
  background:radial-gradient(ellipse 60% 80% at 80% 50%,rgba(19,213,17,.08),transparent 70%);
  pointer-events:none;
}
.hero-eyebrow{
  display:inline-flex;align-items:center;gap:8px;
  font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.22em;
  color:var(--accent);background:rgba(19,213,17,.08);
  border:1px solid rgba(19,213,17,.22);padding:5px 14px;border-radius:30px;
  margin-bottom:28px;
  opacity:0;animation:fadeUp .6s .1s forwards;
}
.hero-eyebrow .dot-live{
  width:7px;height:7px;border-radius:50%;background:var(--accent);
  animation:blink-dot 1.8s ease-in-out infinite;
}
@keyframes blink-dot{0%,100%{opacity:1}50%{opacity:.2}}
.hero-h1{
  font-size:clamp(2.6rem,5vw,4.4rem);font-weight:900;line-height:1.0;
  letter-spacing:-.04em;color:var(--text);
  margin-bottom:20px;
  opacity:0;animation:fadeUp .7s .22s forwards;
}
.hero-h1 .green{
  color:var(--accent);display:inline-block;
  animation:glow-text 3s ease-in-out infinite;
}
@keyframes glow-text{
  0%,100%{text-shadow:0 0 30px rgba(19,213,17,.3)}
  50%{text-shadow:0 0 60px rgba(19,213,17,.6),0 0 100px rgba(19,213,17,.2)}
}
.hero-cursor{
  display:inline-block;width:3px;height:.85em;
  background:var(--accent);margin-left:4px;vertical-align:middle;
  animation:blink-cursor .9s step-end infinite;
}
@keyframes blink-cursor{0%,100%{opacity:1}50%{opacity:0}}
.hero-lead{
  font-size:1.22rem;line-height:1.58;color:var(--text-2);
  max-width:560px;margin-bottom:48px;
  opacity:0;animation:fadeUp .7s .36s forwards;
}
.hero-stats{
  display:flex;gap:12px;flex-wrap:wrap;
  opacity:0;animation:fadeUp .7s .5s forwards;
}
.hstat{
  padding:18px 26px;border:1px solid var(--border);border-radius:14px;
  background:var(--glass);backdrop-filter:blur(8px);
  transition:border-color .2s,transform .2s,background .2s;cursor:default;
}
.hstat:hover{border-color:rgba(19,213,17,.35);background:var(--glass-2);transform:translateY(-3px)}
.hstat .num{font-size:2.2rem;font-weight:900;color:var(--accent);line-height:1;letter-spacing:-.02em}
.hstat .lbl{font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.16em;color:var(--text-3);margin-top:4px}

/* ── CTA banner (como Tripeo) ── */
.cta-banner{
  background:linear-gradient(90deg,rgba(19,213,17,.12) 0%,rgba(19,213,17,.04) 100%);
  border-top:1px solid rgba(19,213,17,.18);border-bottom:1px solid rgba(19,213,17,.18);
  padding:40px 56px;text-align:center;
}
.cta-banner h2{
  font-size:clamp(1.4rem,3vw,2.2rem);font-weight:800;color:var(--text);
  letter-spacing:-.02em;line-height:1.25;
}
.cta-banner h2 .green{color:var(--accent)}

/* ── grid section (temas) ── */
.home-grid-section{padding:52px 56px 64px;flex:1}
.section-label{
  font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.22em;
  color:var(--text-3);margin-bottom:24px;display:flex;align-items:center;gap:12px;
}
.section-label::after{content:"";flex:1;height:1px;background:var(--border)}

.index-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.index-card{
  border:1px solid var(--border);border-radius:16px;padding:22px 20px;cursor:pointer;
  background:var(--glass);position:relative;overflow:hidden;text-align:left;
  transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s,border-color .25s,background .25s;
  opacity:0;transform:translateY(20px);
}
.index-card.visible{animation:cardIn .5s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes cardIn{to{opacity:1;transform:none}}
.index-card::before{
  content:"";position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--accent),transparent);
  opacity:0;transition:opacity .3s;
}
.index-card:hover{transform:translateY(-6px);border-color:rgba(19,213,17,.4);background:var(--glass-2);box-shadow:0 20px 50px -16px rgba(0,0,0,.8),0 0 30px -10px var(--accent-glow)}
.index-card:hover::before{opacity:1}
.index-card .ic-num{font-size:1.6rem;font-weight:900;color:rgba(19,213,17,.25);line-height:1}
.index-card .ic-title{font-weight:700;font-size:.95rem;margin-top:10px;color:var(--text);line-height:1.3}
.index-card .ic-meta{font-size:.7rem;color:var(--text-3);margin-top:8px;display:flex;align-items:center;gap:6px}
.index-card .ic-meta::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--accent);opacity:.55;flex-shrink:0}
.index-card .ic-meta.todo::before{background:var(--text-3)}

/* ── ARTICLE view ── */
.article-wrap{
  max-width:800px;margin:36px auto;padding:52px 58px 80px;
  background:linear-gradient(180deg,rgba(42,42,41,.5),rgba(28,28,26,.4));
  border:1px solid var(--border);border-radius:22px;
  box-shadow:0 32px 80px -28px rgba(0,0,0,.8);backdrop-filter:blur(8px);
  opacity:0;transform:translateY(18px);
  animation:articleIn .5s cubic-bezier(.2,.8,.2,1) forwards;
}
@keyframes articleIn{to{opacity:1;transform:none}}

.breadcrumb{font-size:.73rem;font-weight:500;color:var(--text-3);display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:26px}
.breadcrumb span.crumb{cursor:pointer;transition:color .15s}
.breadcrumb span.crumb:hover{color:var(--accent)}
.breadcrumb .sep{opacity:.4}
.breadcrumb .current{color:var(--text-2);font-weight:600}

.eyebrow{
  display:inline-flex;align-items:center;gap:7px;font-size:.64rem;font-weight:700;
  text-transform:uppercase;letter-spacing:.2em;color:var(--accent);
  background:rgba(19,213,17,.08);border:1px solid rgba(19,213,17,.22);
  padding:5px 14px;border-radius:30px;margin-bottom:20px;
}
.article-wrap h1{
  font-weight:900;font-size:2.75rem;line-height:1.02;letter-spacing:-.04em;
  color:var(--text);margin-bottom:6px;
}
.lead{
  font-size:1.18rem;line-height:1.58;color:var(--text-2);margin:18px 0 32px;
  padding-bottom:28px;border-bottom:1px solid var(--border);
}

/* scroll-reveal for prose elements */
.prose{font-size:1.05rem;line-height:1.8;color:var(--text-2)}
.prose>*+*{margin-top:1.2em}
.prose h2{
  font-weight:800;font-size:1.5rem;color:var(--text);
  margin-top:2.2em;letter-spacing:-.025em;line-height:1.18;
  padding-left:14px;border-left:3px solid var(--accent);
  opacity:0;transform:translateX(-10px);
  transition:opacity .5s,transform .5s;
}
.prose h2.revealed{opacity:1;transform:none}
.prose h3{font-weight:700;font-size:.84rem;text-transform:uppercase;letter-spacing:.12em;color:var(--accent);margin-top:1.9em}
.prose ul,.prose ol{padding-left:1.3em}
.prose li{margin-top:.5em}
.prose li::marker{color:var(--accent)}
.prose strong{font-weight:700;color:var(--text)}
.prose a{color:var(--accent);text-decoration:underline;text-underline-offset:3px;text-decoration-color:rgba(19,213,17,.35)}
.prose code{font-family:var(--mono);font-size:.84em;background:var(--glass-2);padding:2px 8px;border-radius:7px;color:var(--accent-soft);border:1px solid var(--border)}
.prose blockquote{border-left:3px solid var(--coral);padding:4px 0 4px 20px;color:var(--text-3);font-style:italic}

.callout{
  border:1px solid var(--border);background:var(--glass);border-radius:14px;
  padding:16px 20px;font-size:.98rem;line-height:1.6;
  display:flex;gap:14px;align-items:flex-start;
  opacity:0;transform:translateY(12px);transition:opacity .5s,transform .5s;
}
.callout.revealed{opacity:1;transform:none}
.callout .ico{
  width:34px;height:34px;flex-shrink:0;border-radius:10px;display:grid;place-items:center;
  font-weight:700;background:rgba(19,213,17,.13);color:var(--accent);border:1px solid rgba(19,213,17,.25);
}
.callout.warn{border-color:rgba(243,179,77,.25);background:rgba(243,179,77,.06)}
.callout.warn .ico{background:rgba(243,179,77,.16);color:var(--amber);border-color:rgba(243,179,77,.3)}
.callout .ct-title{font-weight:700;font-size:.73rem;text-transform:uppercase;letter-spacing:.1em;margin-bottom:3px;color:var(--text)}

table.tbl{
  width:100%;border-collapse:collapse;font-size:.95rem;
  opacity:0;transform:translateY(10px);transition:opacity .5s,transform .5s;
}
table.tbl.revealed{opacity:1;transform:none}
table.tbl th,table.tbl td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--border)}
table.tbl th{font-weight:700;font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--text-3)}
table.tbl tr:hover td{background:var(--glass)}
table.tbl td strong{color:var(--text)}

.empty-note{
  margin-top:20px;border:1px dashed var(--border-2);border-radius:16px;
  padding:32px;text-align:center;color:var(--text-3);font-size:.95rem;line-height:1.6;
}

/* ── scrim ── */
#scrim{display:none;position:fixed;inset:0;background:rgba(4,7,12,.65);z-index:35;backdrop-filter:blur(3px)}

/* ── keyframes shared ── */
@keyframes fadeUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}

@media(max-width:900px){
  .sidebar{position:fixed;top:var(--nav-h);bottom:0;transform:translateX(-100%);transition:transform .3s cubic-bezier(.4,0,.2,1);height:auto}
  body.nav-open .sidebar{transform:none}
  body.nav-open #scrim{display:block}
  .nav-links{display:none}
  .nav-mobile-btn{display:grid}
  .home-hero,.home-grid-section,.cta-banner{padding-left:22px;padding-right:22px}
  .article-wrap{margin:14px 12px;padding:28px 20px 52px;border-radius:18px}
  .article-wrap h1{font-size:2rem}
  .hero-h1{font-size:2.2rem}
}
</style>
</head>
<body>

<!-- ════════════════════════════════════════════════════════════════
     CÓMO AÑADIR CONOCIMIENTO
     ─────────────────────────────────────────────────────────────────
     Todo el contenido vive en la constante TREE (más abajo, en <script>).
     Cada nodo tiene esta forma:

       {
         id: "identificador-unico",
         title: "Título visible",
         lead: "Frase introductoria",      // opcional
         content: `<p>HTML del tema…</p>`, // opcional
         children: [ …más nodos… ]         // opcional
       }

     Clases estilizadas para el cuerpo:
       <h2> <h3> <p> <ul><li> <table class="tbl">
       <div class="callout"><div class="ico">i</div><div>…</div></div>
       <div class="callout warn">…</div>
       <blockquote>…</blockquote>
     ═══════════════════════════════════════════════════════════════ -->

<div id="prog"></div>

<nav class="topnav">
  <div class="nav-brand" onclick="renderHome()">
    <div class="nav-glyph">
      <svg viewBox="0 0 32 32" fill="none">
        <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#13D511"/><stop offset="1" stop-color="#0fa80e"/>
        </linearGradient></defs>
        <path d="M16 4C10 4 6 8 6 14c0 6 4 10 10 14 6-4 10-8 10-14 0-6-4-10-10-10Z" stroke="url(#g)" stroke-width="1.6" fill="rgba(19,213,17,.08)"/>
        <path d="M16 11v10M12 14.5c1.4 1 2.6 1 4 0s2.6-1 4 0" stroke="#ff7d63" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </div>
    <div>
      <div class="nav-title">Nefrología<br>Pediátrica</div>
      <div class="nav-sub">Base de conocimiento</div>
    </div>
  </div>

  <div class="nav-links">
    <button class="nav-link" onclick="renderHome()">Inicio</button>
    <button class="nav-link" onclick="navigate('fundamentos')">Fundamentos</button>
    <button class="nav-link" onclick="navigate('glomerular')">Glomerular</button>
    <button class="nav-link" onclick="navigate('erc')">ERC</button>
  </div>

  <button class="nav-mobile-btn" id="menuBtn" aria-label="Menú">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M4 6h16M4 12h16M4 18h16" stroke-linecap="round"/>
    </svg>
  </button>
</nav>

<div id="scrim"></div>

<div class="page-body">
  <aside class="sidebar">
    <div class="search-wrap">
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3" stroke-linecap="round"/>
        </svg>
        <input id="search" type="text" placeholder="Buscar tema…" autocomplete="off">
      </div>
    </div>
    <div class="sidebar-label">Temas</div>
    <nav class="tree" id="tree"></nav>
  </aside>

  <div class="main">
    <div class="content-scroll" id="scroll">
      <div id="root"></div>
    </div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════════
   ÁRBOL DE CONOCIMIENTO — edita libremente
   ═══════════════════════════════════════════════════════════════════ */
const TREE = [
  {
    id:"biopsia-tincion",
    title:"Técnicas de tinción en biopsia renal",
    lead:"Histoquímica convencional frente a inmunohistoquímica en nefropatología.",
    content:`<iframe src="biopsias1.html"
      onload="this.style.height=(this.contentWindow.document.body.scrollHeight+32)+'px'"
      style="width:100%;min-height:600px;border:0;border-radius:16px;background:#0a0e17"
      title="Técnicas de tinción en biopsia renal"></iframe>`
  },
  {
    id:"fundamentos",
    title:"Anatomía y fisiología renal",
    lead:"Las bases del riñón en desarrollo: cómo se forma, filtra y madura a lo largo de la infancia.",
    children:[
      {
        id:"nefrogenesis",

          <h2>Hitos del desarrollo</h2>
          <ul>
            <li><strong>Pronefros:</strong> estructura transitoria, regresa precozmente.</li>
            <li><strong>Mesonefros:</strong> función excretora temporal durante el primer trimestre.</li>
            <li><strong>Metanefros:</strong> origen del riñón definitivo, por interacción entre la yema ureteral y el blastema metanéfrico.</li>

          <div class="callout"><div class="ico">i</div><div><div class="ct-title">Concepto clave</div>El número total de nefronas (dotación nefronal) queda fijado al nacer. No se forman nuevas nefronas después. Un número reducido se asocia a mayor riesgo de hipertensión y enfermedad renal en la vida adulta.</div></div>
          <h2>Implicación clínica</h2>
          <p>La prematuridad, el bajo peso al nacer y la restricción del crecimiento intrauterino reducen la dotación nefronal y forman parte de la programación fetal de la enfermedad renal.</p>

          <table class="tbl">

              <tr><td>Recién nacido a término</td><td>≈ 20–40</td></tr>

        lead:"El sedimento y la tira reactiva siguen siendo el estudio más rentable en nefrología.",
        content:`
          <p>El <strong>uroanálisis</strong> orienta el diagnóstico diferencial entre origen glomerular y no glomerular.</p>
          <h3>Tira reactiva</h3>

/* ═══════════════ MOTOR ═══════════════ */
const byId={},parentOf={};
(function idx(nodes,parent){
  nodes.forEach(n=>{byId[n.id]=n;parentOf[n.id]=parent;if(n.children)idx(n.children,n.id);});
})(TREE,null);

const treeEl  = document.getElementById('tree');
const rootEl  = document.getElementById('root');
const scrollEl= document.getElementById('scroll');
const progEl  = document.getElementById('prog');

/* ── sidebar ── */
function buildTree(nodes,depth){
  const ul=document.createElement('ul');ul.className='branch';
  nodes.forEach((n,i)=>{
    const li=document.createElement('li');li.className='node';li.dataset.id=n.id;
    li.style.animationDelay=(depth===0?i*0.04:0)+'s';
    const hasKids=n.children&&n.children.length;
    const row=document.createElement('div');row.className='row';row.dataset.id=n.id;
    const caret=document.createElement('span');
    caret.className='caret'+(hasKids?'':' leaf');
    caret.innerHTML='<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="m9 18 6-6-6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    row.appendChild(caret);
    if(!hasKids){const d=document.createElement('span');d.className='dot';row.appendChild(d);}
    const label=document.createElement('span');label.className='label';label.textContent=n.title;
    row.appendChild(label);
    if(hasKids){const b=document.createElement('span');b.className='badge';b.textContent=n.children.length;row.appendChild(b);}
    caret.addEventListener('click',e=>{e.stopPropagation();if(hasKids)li.classList.toggle('open');});
    row.addEventListener('click',()=>{navigate(n.id);if(hasKids&&!li.classList.contains('open'))li.classList.add('open');});
    li.appendChild(row);
    if(hasKids)li.appendChild(buildTree(n.children,depth+1));
    ul.appendChild(li);
  });
  return ul;
}
treeEl.appendChild(buildTree(TREE,0));

/* ── progress bar ── */
scrollEl.addEventListener('scroll',()=>{
  const {scrollTop,scrollHeight,clientHeight}=scrollEl;
  const pct=scrollHeight-clientHeight>0?scrollTop/(scrollHeight-clientHeight)*100:0;
  progEl.style.width=pct+'%';
});

/* ── scroll-reveal inside articles ── */
let revealObs=null;
function setupReveal(){
  if(revealObs)revealObs.disconnect();
  revealObs=new IntersectionObserver(entries=>{
    entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('revealed');revealObs.unobserve(e.target);}});
  },{threshold:.15});
  rootEl.querySelectorAll('.prose h2, .callout, table.tbl').forEach(el=>revealObs.observe(el));
}

/* ── card stagger ── */
function staggerCards(){
  rootEl.querySelectorAll('.index-card').forEach((c,i)=>{
    c.style.animationDelay=(i*0.06)+'s';
    setTimeout(()=>c.classList.add('visible'),10);
  });
}

/* ── counter animation ── */
function animCount(el,target,duration=900){
  const start=performance.now();
  const step=ts=>{
    const p=Math.min((ts-start)/duration,1);
    const ease=1-Math.pow(1-p,3);
    el.textContent=Math.round(ease*target);
    if(p<1)requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

/* ── navigation ── */
function pathTo(id){const p=[];let c=id;while(c){p.unshift(c);c=parentOf[c];}return p;}
function setActive(id){
  document.querySelectorAll('.row').forEach(r=>r.classList.remove('active'));
  const r=document.querySelector('.row[data-id="'+id+'"]');if(r)r.classList.add('active');
  pathTo(id).forEach(pid=>{
    const li=document.querySelector('li.node[data-id="'+pid+'"]');
    if(li&&pid!==id&&li.querySelector('ul.branch'))li.classList.add('open');
  });
}
function navigate(id){
  const n=byId[id];if(!n)return;
  setActive(id);renderArticle(n);scrollEl.scrollTop=0;
  document.body.classList.remove('nav-open');
  try{history.replaceState(null,'','#'+id);}catch(e){}
}
function breadcrumbHTML(id){
  const path=pathTo(id);
  let html='<span class="crumb" data-go="__home">Inicio</span>';
  path.forEach((pid,i)=>{
    const last=i===path.length-1;
    html+='<span class="sep">/</span>';
    html+=last
      ?'<span class="current">'+byId[pid].title+'</span>'
      :'<span class="crumb" data-go="'+pid+'">'+byId[pid].title+'</span>';
  });
  return html;
}

function renderArticle(n){
  const hasContent=n.content&&n.content.trim().length;
  const parentTitle=parentOf[n.id]?byId[parentOf[n.id]].title:'Área';
  let body='<div class="article-wrap">';
  body+='<div class="breadcrumb">'+breadcrumbHTML(n.id)+'</div>';
  body+='<span class="eyebrow">'+parentTitle+'</span>';
  body+='<h1>'+n.title+'</h1>';
  if(n.lead)body+='<p class="lead">'+n.lead+'</p>';
  if(hasContent){
    body+='<div class="prose">'+n.content+'</div>';
  } else if(n.children&&n.children.length){
    body+='<div class="prose"><p>Esta sección agrupa los siguientes temas:</p></div>';
    body+='<div class="index-grid" style="margin-top:20px">';
    n.children.forEach((c,i)=>{
      const done=c.children?true:(c.content&&c.content.trim().length);
      const meta=c.children?c.children.length+' subtemas':(done?'Disponible':'Por desarrollar');
      body+='<div class="index-card" data-go="'+c.id+'">'
        +'<div class="ic-num">'+String(i+1).padStart(2,'0')+'</div>'
        +'<div class="ic-title">'+c.title+'</div>'
        +'<div class="ic-meta'+(done?'':' todo')+'">'+meta+'</div>'
        +'</div>';
    });
    body+='</div>';
  } else {
    body+='<div class="empty-note">Este tema todavía no tiene contenido.<br>Añádelo editando el campo <code>content</code> del nodo «'+n.id+'».</div>';
  }
  body+='</div>';
  rootEl.innerHTML=body;
  rootEl.querySelectorAll('[data-go]').forEach(el=>el.addEventListener('click',()=>{
    const t=el.dataset.go;t==='__home'?renderHome():navigate(t);
  }));
  staggerCards();
  setupReveal();
}

/* ── typing effect for hero ── */
const WORDS=['Glomerular','Tubular','Crónica','Aguda'];
let wordIdx=0,charIdx=0,deleting=false;
function typeLoop(el){
  const word=WORDS[wordIdx];
  if(!deleting){
    charIdx++;
    el.textContent=word.slice(0,charIdx);
    if(charIdx===word.length){deleting=true;setTimeout(()=>typeLoop(el),1600);return;}
  } else {
    charIdx--;
    el.textContent=word.slice(0,charIdx);
    if(charIdx===0){deleting=false;wordIdx=(wordIdx+1)%WORDS.length;}
  }
  setTimeout(()=>typeLoop(el),deleting?55:95);
}

function countNodes(nodes){
  let total=0;
  (function w(ns){ns.forEach(n=>{total++;if(n.children)w(n.children);});})(nodes);
  return total;
}

function renderHome(){
  document.querySelectorAll('.row').forEach(r=>r.classList.remove('active'));
  try{history.replaceState(null,'','#');}catch(e){}

  const total=countNodes(TREE);
  const withContent=Object.values(byId).filter(n=>n.content&&n.content.trim().length).length;

  let html='<div class="home-wrap">';

  /* hero */
  html+='<div class="home-hero">'
    +'<div class="hero-eyebrow"><span class="dot-live"></span>Base de conocimiento activa</div>'
    +'<h1 class="hero-h1">Nefrología <span class="green" id="typed-word">Pediátrica</span><span class="hero-cursor"></span></h1>'
    +'<p class="hero-lead">Una biblioteca estructurada y creciente del conocimiento de la disciplina, organizada tema a tema para la práctica clínica.</p>'
    +'<div class="hero-stats">'
    +'<div class="hstat"><div class="num" id="sc-areas">0</div><div class="lbl">Áreas</div></div>'
    +'<div class="hstat"><div class="num" id="sc-total">0</div><div class="lbl">Temas</div></div>'
    +'<div class="hstat"><div class="num" id="sc-done">0</div><div class="lbl">Desarrollados</div></div>'
    +'</div></div>';

  /* cta banner */
  html+='<div class="cta-banner">'
    +'<h2>Selecciona un área y empieza a <span class="green">explorar el conocimiento</span></h2>'
    +'</div>';

  /* grid */
  html+='<div class="home-grid-section">'
    +'<div class="section-label">Todas las áreas</div>'
    +'<div class="index-grid">';
  TREE.forEach((n,i)=>{
    const meta=n.children?n.children.length+' temas':'Tema único';
    html+='<div class="index-card" data-go="'+n.id+'">'
      +'<div class="ic-num">'+String(i+1).padStart(2,'0')+'</div>'
      +'<div class="ic-title">'+n.title+'</div>'
      +'<div class="ic-meta">'+meta+'</div>'
      +'</div>';
  });
  html+='</div></div></div>';

  rootEl.innerHTML=html;
  rootEl.querySelectorAll('[data-go]').forEach(el=>el.addEventListener('click',()=>navigate(el.dataset.go)));
  staggerCards();

  /* counters */
  animCount(document.getElementById('sc-areas'),TREE.length);
  animCount(document.getElementById('sc-total'),total);
  animCount(document.getElementById('sc-done'),withContent);

  /* typing */
  const tw=document.getElementById('typed-word');
  if(tw){tw.textContent='';setTimeout(()=>typeLoop(tw),800);}
}

/* ── search ── */
const searchEl=document.getElementById('search');
searchEl.addEventListener('input',()=>{
  const q=searchEl.value.trim().toLowerCase();
  const lis=treeEl.querySelectorAll('li.node');
  if(!q){lis.forEach(li=>{li.classList.remove('hidden','open');});return;}
  lis.forEach(li=>li.classList.add('hidden'));
  treeEl.querySelectorAll('.row').forEach(r=>{
    if(r.querySelector('.label').textContent.toLowerCase().includes(q)){
      let cur=r.dataset.id;
      while(cur){
        const li=treeEl.querySelector('li.node[data-id="'+cur+'"]');
        if(li){li.classList.remove('hidden');if(cur!==r.dataset.id)li.classList.add('open');}
        cur=parentOf[cur];
      }
    }
  });
});

document.getElementById('menuBtn').addEventListener('click',()=>document.body.classList.toggle('nav-open'));
document.getElementById('scrim').addEventListener('click',()=>document.body.classList.remove('nav-open'));

const initial=location.hash.slice(1);
if(initial&&byId[initial])navigate(initial);else renderHome();
</script>
</body>
