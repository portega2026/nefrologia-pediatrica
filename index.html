<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nefrología Pediátrica · Base de Conocimiento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,300;0,400;0,600;0,700;0,800;0,900;1,300;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg-0:#f4f6f8;
  --bg-1:#ffffff;
  --panel:#ffffff;
  --panel-2:#f0f2f5;
  --glass:rgba(37,99,235,.04);
  --glass-2:rgba(37,99,235,.07);
  --border:#dde2e8;
  --border-2:#c8d0d8;
  --text:#111827;
  --text-2:#374151;
  --text-3:#9ca3af;
  --accent:#2563eb;
  --accent-2:#1d4ed8;
  --accent-soft:#93c5fd;
  --accent-glow:rgba(37,99,235,.15);
  --coral:#e53e3e;
  --amber:#d97706;
  --font:'Exo 2',system-ui,sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,monospace;
  --sidebar-w:280px;
  --tags-w:220px;
  --nav-h:68px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:var(--font);
  background:var(--bg-0);
  color:var(--text-2);
  -webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;
  min-height:100vh;overflow-x:hidden;
}

/* ── progress bar ── */
#prog{position:fixed;top:0;left:0;height:3px;width:0%;background:var(--accent);z-index:200;transition:width .1s linear;pointer-events:none}

/* ── nav ── */
.topnav{
  height:var(--nav-h);background:var(--panel);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 28px;position:sticky;top:0;z-index:100;flex-shrink:0;
}
.nav-brand{display:flex;align-items:center;gap:12px;cursor:pointer;text-decoration:none}
.nav-glyph{
  width:40px;height:40px;border-radius:10px;flex-shrink:0;
  background:var(--accent);
  display:grid;place-items:center;
}
.nav-glyph svg{width:24px;height:24px}
.nav-title{font-weight:800;font-size:1.05rem;color:var(--text);letter-spacing:-.02em;line-height:1.1}
.nav-sub{font-size:.54rem;text-transform:uppercase;letter-spacing:.22em;color:var(--accent);font-weight:700;margin-top:2px}
.nav-links{display:flex;align-items:center;gap:28px}
.nav-link{
  font-size:.9rem;font-weight:600;color:var(--text-2);cursor:pointer;
  background:none;border:none;font-family:var(--font);
  letter-spacing:.01em;transition:color .18s;padding:0;
}
.nav-link:hover{color:var(--accent)}
.nav-mobile-btn{
  display:none;background:var(--panel-2);border:1px solid var(--border);
  border-radius:8px;width:40px;height:40px;color:var(--text);cursor:pointer;place-items:center;
}

/* ── layout ── */
.page-body{display:flex;flex:1;min-height:0}

/* ── sidebar ── */
.sidebar{
  width:var(--sidebar-w);flex-shrink:0;
  height:calc(100vh - var(--nav-h));position:sticky;top:var(--nav-h);
  z-index:40;background:var(--panel);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;
}
.search-wrap{padding:14px 12px 8px}
.search-box{position:relative;display:flex;align-items:center}
.search-box svg{position:absolute;left:11px;width:14px;height:14px;color:var(--text-3)}
#search{
  width:100%;font-family:var(--font);font-size:.855rem;font-weight:500;color:var(--text);
  padding:9px 12px 9px 34px;border-radius:8px;border:1px solid var(--border);
  background:var(--bg-0);outline:none;transition:.18s;
}
#search::placeholder{color:var(--text-3)}
#search:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
.sidebar-label{padding:8px 14px 4px;font-size:.58rem;font-weight:700;text-transform:uppercase;letter-spacing:.2em;color:var(--text-3)}

.tree{flex:1;overflow-y:auto;padding:4px 8px 28px}
.tree::-webkit-scrollbar{width:4px}
.tree::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:4px}

ul.branch{list-style:none}
ul.branch ul.branch{
  margin-left:10px;border-left:1px solid var(--border);padding-left:4px;
  overflow:hidden;max-height:0;opacity:0;
  transition:max-height .3s ease,opacity .25s ease;
}
li.node.open>ul.branch{max-height:3000px;opacity:1}

.row{
  display:flex;align-items:center;gap:6px;font-size:.855rem;font-weight:500;
  color:var(--text-2);padding:8px 10px;margin:1px 0;border-radius:8px;
  cursor:pointer;position:relative;transition:background .14s,color .14s;
}
.row:hover{background:var(--panel-2);color:var(--text)}
.row.active{
  background:rgba(37,99,235,.08);
  color:var(--accent);
}
.row.active::before{
  content:"";position:absolute;left:0;top:20%;bottom:20%;width:3px;border-radius:3px;
  background:var(--accent);
}
.row .caret{width:14px;height:14px;flex-shrink:0;display:grid;place-items:center;transition:transform .22s ease;color:var(--text-3)}
li.node.open>.row .caret{transform:rotate(90deg);color:var(--accent)}
.row .caret.leaf{visibility:hidden}
.row .label{flex:1;line-height:1.32}
.row .badge{font-size:.57rem;font-weight:700;background:rgba(37,99,235,.1);color:var(--accent);border-radius:20px;padding:2px 7px}
.row .dot{width:4px;height:4px;border-radius:50%;background:var(--accent);margin-right:2px;flex-shrink:0;opacity:.45}
.row.hidden,li.node.hidden{display:none}
li.node{opacity:0;animation:nodeIn .3s ease forwards}
@keyframes nodeIn{from{opacity:0}to{opacity:1}}

/* ── main ── */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.content-scroll{flex:1;overflow-y:auto}

/* ── tags sidebar ── */
.tags-panel{
  width:var(--tags-w);flex-shrink:0;
  height:calc(100vh - var(--nav-h));position:sticky;top:var(--nav-h);
  z-index:40;background:var(--panel);
  border-left:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;
}
.tags-panel .tags-wrap{padding:14px 14px 18px;overflow-y:auto;flex:1}
.tags-panel .tags-wrap::-webkit-scrollbar{width:4px}
.tags-panel .tags-wrap::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:4px}
.tag-summary{
  padding:14px 14px 10px;
  border-bottom:1px solid var(--border);
  background:linear-gradient(180deg, rgba(37,99,235,.05), transparent);
}
.tag-summary .ts-label{
  font-size:.58rem;font-weight:700;text-transform:uppercase;letter-spacing:.18em;color:var(--text-3);
}
.tag-summary .ts-value{
  margin-top:8px;font-size:1rem;font-weight:800;line-height:1.3;color:var(--text);
}
.tag-summary .ts-count{
  display:inline-flex;align-items:center;margin-top:6px;
  font-size:.68rem;font-weight:700;color:var(--accent);
  background:rgba(37,99,235,.08);border:1px solid rgba(37,99,235,.16);
  padding:3px 8px;border-radius:999px;
}
.tag-cloud{display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
.tag{
  display:inline-flex;align-items:center;
  border-radius:999px;border:1px solid rgba(37,99,235,.16);
  background:rgba(37,99,235,.05);color:var(--accent-2);
  padding:5px 10px;line-height:1;white-space:nowrap;
  font-weight:700;letter-spacing:-.01em;
  transition:transform .18s,border-color .18s,background .18s;
}
.tag-clickable{cursor:pointer}
.tag:hover{transform:translateY(-1px);border-color:rgba(37,99,235,.35);background:rgba(37,99,235,.09)}
.tag-meta{font-size:.55rem;color:var(--text-3);margin-left:6px;font-weight:700}
.tag-selected{border-color:rgba(34,197,94,.45);background:rgba(34,197,94,.14);color:#166534}
.tag-selected .tag-meta{color:#4b7f5b}
.row.tag-hit{
  background:rgba(34,197,94,.08);
  color:#166534;
}
.row.tag-hit::before{background:#22c55e}
.row.tag-group{
  background:rgba(34,197,94,.05);
  color:#14532d;
}

/* ── HOME view ── */
.home-wrap{min-height:calc(100vh - var(--nav-h));display:flex;flex-direction:column}

.home-hero{
  background:var(--panel);
  border-bottom:1px solid var(--border);
  padding:60px 52px 56px;
}
.hero-eyebrow{
  display:inline-flex;align-items:center;gap:8px;
  font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.2em;
  color:var(--accent);background:rgba(37,99,235,.07);
  border:1px solid rgba(37,99,235,.2);padding:5px 14px;border-radius:30px;
  margin-bottom:24px;
}
.hero-eyebrow .dot-live{
  width:6px;height:6px;border-radius:50%;background:var(--accent);
  animation:blink-dot 2s ease-in-out infinite;
}
@keyframes blink-dot{0%,100%{opacity:1}50%{opacity:.25}}
.hero-h1{
  font-size:clamp(2.2rem,4.5vw,3.6rem);font-weight:900;line-height:1.05;
  letter-spacing:-.03em;color:var(--text);
  margin-bottom:16px;
}
.hero-h1 .green{color:var(--accent)}
.hero-cursor{
  display:inline-block;width:2px;height:.8em;
  background:var(--accent);margin-left:3px;vertical-align:middle;
  animation:blink-cursor .9s step-end infinite;
}
@keyframes blink-cursor{0%,100%{opacity:1}50%{opacity:0}}
.hero-lead{
  font-size:1.1rem;line-height:1.6;color:var(--text-2);
  max-width:520px;margin-bottom:40px;
}
.hero-stats{display:flex;gap:10px;flex-wrap:wrap}
.hstat{
  padding:16px 22px;border:1px solid var(--border);border-radius:12px;
  background:var(--bg-0);
  transition:border-color .18s,transform .18s;cursor:default;
}
.hstat:hover{border-color:var(--accent);transform:translateY(-2px)}
.hstat .num{font-size:2rem;font-weight:900;color:var(--accent);line-height:1;letter-spacing:-.02em}
.hstat .lbl{font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.14em;color:var(--text-3);margin-top:4px}

/* ── CTA banner ── */
.cta-banner{
  background:rgba(37,99,235,.05);
  border-top:1px solid rgba(37,99,235,.12);border-bottom:1px solid rgba(37,99,235,.12);
  padding:32px 52px;text-align:center;
}
.cta-banner h2{
  font-size:clamp(1.2rem,2.5vw,1.8rem);font-weight:700;color:var(--text);
  letter-spacing:-.01em;line-height:1.3;
}
.cta-banner h2 .green{color:var(--accent)}

/* ── grid section (temas) ── */
.home-grid-section{padding:44px 52px 56px;flex:1}
.section-label{
  font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.2em;
  color:var(--text-3);margin-bottom:20px;display:flex;align-items:center;gap:10px;
}
.section-label::after{content:"";flex:1;height:1px;background:var(--border)}

.index-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.index-card{
  border:1px solid var(--border);border-radius:12px;padding:20px 18px;cursor:pointer;
  background:var(--panel);text-align:left;
  transition:transform .2s,box-shadow .2s,border-color .2s;
  opacity:0;
}
.index-card.visible{animation:cardIn .35s ease forwards}
@keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.index-card:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 8px 24px -8px rgba(37,99,235,.18)}
.index-card .ic-num{font-size:1.4rem;font-weight:900;color:rgba(37,99,235,.2);line-height:1}
.index-card .ic-title{font-weight:700;font-size:.92rem;margin-top:10px;color:var(--text);line-height:1.3}
.index-card .ic-meta{font-size:.68rem;color:var(--text-3);margin-top:6px;display:flex;align-items:center;gap:5px}
.index-card .ic-meta::before{content:"";width:4px;height:4px;border-radius:50%;background:var(--accent);opacity:.6;flex-shrink:0}
.index-card .ic-meta.todo::before{background:var(--text-3)}

/* ── ARTICLE view ── */
.article-wrap{
  max-width:780px;margin:32px auto;padding:44px 52px 72px;
  background:var(--panel);
  border:1px solid var(--border);border-radius:16px;
  box-shadow:0 4px 24px -8px rgba(0,0,0,.08);
  opacity:0;transform:translateY(12px);
  animation:articleIn .35s ease forwards;
}
@keyframes articleIn{to{opacity:1;transform:none}}

.breadcrumb{font-size:.72rem;font-weight:500;color:var(--text-3);display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:22px}
.breadcrumb span.crumb{cursor:pointer;transition:color .14s}
.breadcrumb span.crumb:hover{color:var(--accent)}
.breadcrumb .sep{opacity:.35}
.breadcrumb .current{color:var(--text-2);font-weight:600}

.eyebrow{
  display:inline-flex;align-items:center;gap:6px;font-size:.62rem;font-weight:700;
  text-transform:uppercase;letter-spacing:.18em;color:var(--accent);
  background:rgba(37,99,235,.07);border:1px solid rgba(37,99,235,.2);
  padding:4px 12px;border-radius:30px;margin-bottom:18px;
}
.article-wrap h1{
  font-weight:900;font-size:2.4rem;line-height:1.05;letter-spacing:-.03em;
  color:var(--text);margin-bottom:4px;
}
.lead{
  font-size:1.1rem;line-height:1.6;color:var(--text-2);margin:16px 0 28px;
  padding-bottom:24px;border-bottom:1px solid var(--border);
}

/* scroll-reveal for prose elements */
.prose{font-size:1rem;line-height:1.78;color:var(--text-2)}
.prose>*+*{margin-top:1.1em}
.prose h2{
  font-weight:800;font-size:1.35rem;color:var(--text);
  margin-top:2em;letter-spacing:-.02em;line-height:1.2;
  padding-left:12px;border-left:3px solid var(--accent);
  opacity:0;transform:translateX(-8px);
  transition:opacity .4s,transform .4s;
}
.prose h2.revealed{opacity:1;transform:none}
.prose h3{font-weight:700;font-size:.82rem;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);margin-top:1.8em}
.prose ul,.prose ol{padding-left:1.3em}
.prose li{margin-top:.45em}
.prose li::marker{color:var(--accent)}
.prose strong{font-weight:700;color:var(--text)}
.prose a{color:var(--accent);text-decoration:underline;text-underline-offset:3px;text-decoration-color:rgba(37,99,235,.35)}
.prose code{font-family:var(--mono);font-size:.83em;background:var(--bg-0);padding:2px 7px;border-radius:6px;color:var(--accent-2);border:1px solid var(--border)}
.prose blockquote{border-left:3px solid var(--coral);padding:4px 0 4px 18px;color:var(--text-3);font-style:italic}

.callout{
  border:1px solid rgba(37,99,235,.2);background:rgba(37,99,235,.05);border-radius:12px;
  padding:14px 18px;font-size:.97rem;line-height:1.6;
  display:flex;gap:12px;align-items:flex-start;
  opacity:0;transform:translateY(8px);transition:opacity .4s,transform .4s;
}
.callout.revealed{opacity:1;transform:none}
.callout .ico{
  width:32px;height:32px;flex-shrink:0;border-radius:8px;display:grid;place-items:center;
  font-weight:700;background:rgba(37,99,235,.12);color:var(--accent);
}
.callout.warn{border-color:rgba(217,119,6,.25);background:rgba(217,119,6,.06)}
.callout.warn .ico{background:rgba(217,119,6,.14);color:var(--amber)}
.callout .ct-title{font-weight:700;font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;margin-bottom:3px;color:var(--text)}

table.tbl{
  width:100%;border-collapse:collapse;font-size:.93rem;
  opacity:0;transform:translateY(8px);transition:opacity .4s,transform .4s;
}
table.tbl.revealed{opacity:1;transform:none}
table.tbl th,table.tbl td{text-align:left;padding:10px 13px;border-bottom:1px solid var(--border)}
table.tbl th{font-weight:700;font-size:.66rem;text-transform:uppercase;letter-spacing:.07em;color:var(--text-3)}
table.tbl tr:hover td{background:var(--bg-0)}
table.tbl td strong{color:var(--text)}

.empty-note{
  margin-top:20px;border:1px dashed var(--border-2);border-radius:12px;
  padding:28px;text-align:center;color:var(--text-3);font-size:.92rem;line-height:1.6;
}

/* ── scrim ── */
#scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:35}

/* ── keyframes shared ── */
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

@media(max-width:900px){
  .sidebar{position:fixed;top:var(--nav-h);bottom:0;transform:translateX(-100%);transition:transform .28s ease;height:auto}
  .tags-panel{display:none}
  body.nav-open .sidebar{transform:none}
  body.nav-open #scrim{display:block}
  .nav-links{display:none}
  .nav-mobile-btn{display:grid}
  .home-hero,.home-grid-section,.cta-banner{padding-left:20px;padding-right:20px}
  .article-wrap{margin:12px 10px;padding:24px 18px 48px;border-radius:14px}
  .article-wrap h1{font-size:1.8rem}
  .hero-h1{font-size:2rem}
}
</style>
</head>
<body>

<!-- ════════════════════════════════════════════════════════════════
     CÓMO AÑADIR CONOCIMIENTO
     ─────────────────────────────────────────────────────────────────
     Todo el contenido vive en la constante TREE (más abajo, en <script>).
     Cada nodo tiene esta forma:

       {
         id: "identificador-unico",
         title: "Título visible",
         lead: "Frase introductoria",      // opcional
         content: `<p>HTML del tema…</p>`, // opcional
         children: [ …más nodos… ]         // opcional
       }

     Clases estilizadas para el cuerpo:
       <h2> <h3> <p> <ul><li> <table class="tbl">
       <div class="callout"><div class="ico">i</div><div>…</div></div>
       <div class="callout warn">…</div>
       <blockquote>…</blockquote>
     ═══════════════════════════════════════════════════════════════ -->

<div id="prog"></div>

<nav class="topnav">
  <div class="nav-brand" onclick="renderHome()">
    <div class="nav-glyph">
      <svg viewBox="0 0 32 32" fill="none">
        <path d="M16 4C10 4 6 8 6 14c0 6 4 10 10 14 6-4 10-8 10-14 0-6-4-10-10-10Z" stroke="white" stroke-width="1.6" fill="rgba(255,255,255,.15)"/>
        <path d="M16 11v10M12 14.5c1.4 1 2.6 1 4 0s2.6-1 4 0" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </div>
    <div>
      <div class="nav-title">Nefrología<br>Pediátrica</div>
      <div class="nav-sub">Base de conocimiento</div>
    </div>
  </div>

  <div class="nav-links">
    <button class="nav-link" onclick="renderHome()">Inicio</button>
    <button class="nav-link" onclick="navigate('fundamentos')">Fundamentos</button>
    <button class="nav-link" onclick="navigate('glomerular')">Glomerular</button>
    <button class="nav-link" onclick="navigate('erc')">ERC</button>
  </div>

  <button class="nav-mobile-btn" id="menuBtn" aria-label="Menú">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M4 6h16M4 12h16M4 18h16" stroke-linecap="round"/>
    </svg>
  </button>
</nav>

<div id="scrim"></div>

<div class="page-body">
  <aside class="sidebar">
    <div class="search-wrap">
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3" stroke-linecap="round"/>
        </svg>
        <input id="search" type="text" placeholder="Buscar tema…" autocomplete="off">
      </div>
    </div>
    <div class="sidebar-label">Temas</div>
    <nav class="tree" id="tree"></nav>
  </aside>

  <div class="main">
    <div class="content-scroll" id="scroll">
      <div id="root"></div>
    </div>
  </div>

  <aside class="tags-panel">
    <div class="sidebar-label">Etiquetas</div>
    <div class="tag-summary" id="tagSummary" style="display:none">
      <div class="ts-label">Etiqueta activa</div>
      <div class="ts-value" id="tagSummaryName"></div>
      <div class="ts-count" id="tagSummaryCount"></div>
    </div>
    <div class="tags-wrap">
      <div class="tag-cloud" id="tagCloud"></div>
    </div>
  </aside>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════════
   ÁRBOL DE CONOCIMIENTO — edita libremente
   ═══════════════════════════════════════════════════════════════════ */
const TREE = [
  {
    id: "nefrogenetica",
    title: "Nefrogenética",
    lead: "Patogenicidad, penetrancia y expresividad en enfermedad renal hereditaria.",
    children: [
      {
        id: "col4a3-patogenicidad-genetica",
        title: "COL4A3. Interpretación de la patogenicidad en función de la genética",
        lead: " ",
        contentUrl: "temas/col4a3-patogenicidad-genetica.html",
      },
      {
        id: "col4a4-patogenicidad-genetica",
        title: "COL4A4. Interpretación de la patogenicidad en función de la genética",
        lead: " ",

          <p>El <strong>aclaramiento renal</strong> (o depuración renal) de una sustancia X se define como el <strong>volumen de plasma que el riñón es capaz de limpiar completamente de esa sustancia por unidad de tiempo</strong>. No implica necesariamente que ese volumen quede literalmente "vacío", sino que es un volumen equivalente calculado a partir de las cantidades excretadas.</p>

          <h2>Fórmula general</h2>
          <p>La expresión matemática del aclaramiento es:</p>
          <div class="callout">
            <div class="ico">f</div>
            <div>
              <div class="ct-title">Fórmula del aclaramiento</div>

              <p>Donde <strong>U<sub>x</sub></strong> es la concentración de X en orina, <strong>V̇</strong> es el flujo urinario (ml/min) y <strong>P<sub>x</sub></strong> es la concentración plasmática de X. El resultado se expresa en <strong>ml/min</strong>, o corregido por superficie corporal en <strong>ml/min/1,73 m²</strong>.</p>

            </tbody>

          <h2>La inulina como patrón de referencia</h2>
          <p>La <strong>inulina</strong> es el marcador ideal para medir el filtrado glomerular porque cumple todas las condiciones teóricas: se filtra libremente en el glomérulo, no se reabsorbe ni se secreta en el túbulo, no se metaboliza y no es tóxica. Por eso, su aclaramiento equivale al <strong>filtrado glomerular real</strong>.</p>

const byId={},parentOf={};
(function idx(nodes,parent){
  nodes.forEach(n=>{byId[n.id]=n;parentOf[n.id]=parent;if(n.children)idx(n.children,n.id);});
})(TREE,null);

const treeEl  = document.getElementById('tree');
const rootEl  = document.getElementById('root');
const scrollEl= document.getElementById('scroll');
const progEl  = document.getElementById('prog');
const tagCloudEl = document.getElementById('tagCloud');
const tagSummaryEl = document.getElementById('tagSummary');
const tagSummaryNameEl = document.getElementById('tagSummaryName');
const tagSummaryCountEl = document.getElementById('tagSummaryCount');
let selectedTag = null;

/* ── sidebar ── */
function buildTree(nodes,depth){
  const ul=document.createElement('ul');ul.className='branch';
  nodes.forEach((n,i)=>{
    const li=document.createElement('li');li.className='node';li.dataset.id=n.id;
    li.style.animationDelay=(depth===0?i*0.04:0)+'s';
    const hasKids=n.children&&n.children.length;
    const row=document.createElement('div');row.className='row';row.dataset.id=n.id;
    const caret=document.createElement('span');
    caret.className='caret'+(hasKids?'':' leaf');
    caret.innerHTML='<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="m9 18 6-6-6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    row.appendChild(caret);
    if(!hasKids){const d=document.createElement('span');d.className='dot';row.appendChild(d);}
    const label=document.createElement('span');label.className='label';label.textContent=n.title;
    row.appendChild(label);
    if(hasKids){const b=document.createElement('span');b.className='badge';b.textContent=n.children.length;row.appendChild(b);}
    caret.addEventListener('click',e=>{e.stopPropagation();if(hasKids)li.classList.toggle('open');});
    row.addEventListener('click',()=>{navigate(n.id);if(hasKids&&!li.classList.contains('open'))li.classList.add('open');});
    li.appendChild(row);
    if(hasKids)li.appendChild(buildTree(n.children,depth+1));
    ul.appendChild(li);
  });
  return ul;
}
treeEl.appendChild(buildTree(TREE,0));

const STOPWORDS = new Set([
  'de','la','el','y','o','u','a','en','del','al','los','las','un','una','unos','unas',
  'por','para','con','sin','sobre','como','más','menos','muy','no','sí','se','su','sus',
  'que','qué','quien','quién','cuando','cuándo','donde','dónde','si','ya','también',
  'esto','esta','este','estas','estos','esa','ese','esas','esos','ser','son','fue','son',
  'hay','lo','le','les','mi','tu','te','nos','vos','o','e','u','pero','porque','pues',
  'cada','todo','toda','todos','todas','otro','otra','otros','otras','según','entre',
  'hacia','desde','hasta','muy','más','menos','solo','sólo','aquí','allí','aqui','alli',
]);

function stripHtml(html){
  return String(html||'').replace(/<[^>]*>/g,' ');
}

function collectTagCounts(nodes, counts){
  nodes.forEach(n=>{
    const text = [n.title, n.lead, stripHtml(n.content)].filter(Boolean).join(' ');
    const words = text.toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
      .match(/[a-z0-9α-ωά-ώñü]+/gi) || [];
    words.forEach(w=>{
      const word = w.toLowerCase();
      if(word.length < 4) return;
      if(STOPWORDS.has(word)) return;
      counts.set(word, (counts.get(word) || 0) + 1);
    });
    if(n.children) collectTagCounts(n.children, counts);
  });
}

function collectTopicTagCounts(nodes, counts){
  nodes.forEach(n=>{
    if(Array.isArray(n.tags)){
      const uniqueTags = [...new Set(n.tags)];
      uniqueTags.forEach(tag=>{
        counts.set(tag, (counts.get(tag) || 0) + 1);
      });
    }
    if(n.children) collectTopicTagCounts(n.children, counts);
  });
}

function selectTaggedTopics(tag){
  if(selectedTag === tag){
    clearTagFilter();
    return;
  }
  selectedTag = tag;
  document.querySelectorAll('.tag').forEach(el=>el.classList.toggle('tag-selected', el.dataset.tag === tag));

  const matches = new Set();
  (function walk(nodes){
    nodes.forEach(n=>{
      if(Array.isArray(n.tags) && n.tags.includes(tag)) matches.add(n.id);
      if(n.children) walk(n.children);
    });
  })(TREE);

  const firstMatch = Array.from(matches)[0];

  if(tagSummaryEl && tagSummaryNameEl && tagSummaryCountEl){
    tagSummaryEl.style.display = 'block';
    tagSummaryNameEl.textContent = tag;
    tagSummaryCountEl.textContent = matches.size + (matches.size === 1 ? ' tema' : ' temas');
  }

  document.querySelectorAll('.row').forEach(r=>r.classList.remove('active','tag-hit','tag-group'));
  document.querySelectorAll('li.node').forEach(li=>li.classList.remove('hidden','open'));

  const relevantNodes = new Set();
  matches.forEach(id=>{
    let cur = id;
    while(cur){
      relevantNodes.add(cur);
      cur = parentOf[cur];
    }
  });

  document.querySelectorAll('li.node').forEach(li=>{
    const id = li.dataset.id;
    const node = byId[id];
    const selfMatch = matches.has(id);
    const relevant = relevantNodes.has(id);
    if(!relevant) {
      li.classList.add('hidden');
      return;
    }

    let cur = id;
    while(cur){
      const curLi = treeEl.querySelector('li.node[data-id="'+cur+'"]');
      if(curLi) curLi.classList.remove('hidden');
      const parent = parentOf[cur];
      if(parent){
        const pl = treeEl.querySelector('li.node[data-id="'+parent+'"]');
        if(pl) pl.classList.remove('hidden');
      }
      cur = parent;
    }

    const row = li.querySelector('.row');
    if(row){
      if(selfMatch) row.classList.add('active','tag-hit');
      else row.classList.add('tag-group');
    }
    if(node && node.children && node.children.length) li.classList.add('open');
  });

  if(firstMatch) navigate(firstMatch);
}

function clearTagFilter(){
  selectedTag = null;
  document.querySelectorAll('.tag').forEach(el=>el.classList.remove('tag-selected'));
  document.querySelectorAll('.row').forEach(r=>r.classList.remove('active','tag-hit','tag-group'));
  document.querySelectorAll('li.node').forEach(li=>li.classList.remove('hidden','open'));
  if(tagSummaryEl){
    tagSummaryEl.style.display = 'none';
    if(tagSummaryNameEl) tagSummaryNameEl.textContent = '';
    if(tagSummaryCountEl) tagSummaryCountEl.textContent = '';
  }
  const active = location.hash.slice(1);
  if(active && byId[active]) setActive(active);
  renderTags();
}

function renderTags(){
  if(!tagCloudEl) return;
  const active = location.hash.slice(1);
  const activeNode = byId[active];
  if(activeNode && Array.isArray(activeNode.tags) && activeNode.tags.length){
    tagCloudEl.innerHTML = activeNode.tags.map(tag =>
      `<span class="tag tag-clickable" data-tag="${tag}" style="font-size:16px">${tag}</span>`
    ).join('');
    tagCloudEl.querySelectorAll('[data-tag]').forEach(el=>{
      el.addEventListener('click',()=>selectTaggedTopics(el.dataset.tag));
    });
    return;
  }
  const counts = new Map();
  collectTopicTagCounts(TREE, counts);
  const tags = Array.from(counts.entries())
    .sort((a,b)=>b[1]-a[1] || a[0].localeCompare(b[0]))
    .slice(0, 40);
  const max = tags[0]?.[1] || 1;
  const min = tags[tags.length-1]?.[1] || 1;
  tagCloudEl.innerHTML = tags.map(([tag,count])=>{
    const t = max === min ? 1 : (count - min) / (max - min);
    const size = 12 + t * 16;
    return `<span class="tag tag-clickable" data-tag="${tag}" style="font-size:${size}px" title="${count} temas">${tag}<span class="tag-meta">${count}</span></span>`;
  }).join('');
  tagCloudEl.querySelectorAll('[data-tag]').forEach(el=>{
    el.addEventListener('click',()=>selectTaggedTopics(el.dataset.tag));
  });
}
renderTags();

/* ── progress bar ── */
scrollEl.addEventListener('scroll',()=>{
  const {scrollTop,scrollHeight,clientHeight}=scrollEl;
  const pct=scrollHeight-clientHeight>0?scrollTop/(scrollHeight-clientHeight)*100:0;
  progEl.style.width=pct+'%';
});

/* ── scroll-reveal inside articles ── */
let revealObs=null;
function setupReveal(){
  if(revealObs)revealObs.disconnect();
  revealObs=new IntersectionObserver(entries=>{
    entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('revealed');revealObs.unobserve(e.target);}});
  },{threshold:.15});
  rootEl.querySelectorAll('.prose h2, .callout, table.tbl').forEach(el=>revealObs.observe(el));
}

/* ── card stagger ── */
function staggerCards(){
  rootEl.querySelectorAll('.index-card').forEach((c,i)=>{
    c.style.animationDelay=(i*0.06)+'s';
    setTimeout(()=>c.classList.add('visible'),10);
  });
}

/* ── counter animation ── */
function animCount(el,target,duration=900){
  const start=performance.now();
  const step=ts=>{
    const p=Math.min((ts-start)/duration,1);
    const ease=1-Math.pow(1-p,3);
    el.textContent=Math.round(ease*target);
    if(p<1)requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

/* ── navigation ── */
function pathTo(id){const p=[];let c=id;while(c){p.unshift(c);c=parentOf[c];}return p;}
function setActive(id){
  document.querySelectorAll('.row').forEach(r=>r.classList.remove('active'));
  const r=document.querySelector('.row[data-id="'+id+'"]');if(r)r.classList.add('active');
  pathTo(id).forEach(pid=>{
    const li=document.querySelector('li.node[data-id="'+pid+'"]');
    if(li&&pid!==id&&li.querySelector('ul.branch'))li.classList.add('open');
  });
}
function navigate(id){
  const n=byId[id];if(!n)return;
  setActive(id);renderArticle(n);scrollEl.scrollTop=0;
  renderTags();
  document.body.classList.remove('nav-open');
  try{history.replaceState(null,'','#'+id);}catch(e){}
}
function breadcrumbHTML(id){
  const path=pathTo(id);
  let html='<span class="crumb" data-go="__home">Inicio</span>';
  path.forEach((pid,i)=>{
    const last=i===path.length-1;
    html+='<span class="sep">/</span>';
    html+=last
      ?'<span class="current">'+byId[pid].title+'</span>'
      :'<span class="crumb" data-go="'+pid+'">'+byId[pid].title+'</span>';
  });
  return html;
}

function renderArticle(n){
  const hasContent=(n.content&&n.content.trim().length) || n.contentUrl;
  const parentTitle=parentOf[n.id]?byId[parentOf[n.id]].title:'Área';
  let body='<div class="article-wrap">';
  body+='<div class="breadcrumb">'+breadcrumbHTML(n.id)+'</div>';
  body+='<span class="eyebrow">'+parentTitle+'</span>';
  body+='<h1>'+n.title+'</h1>';
  if(n.lead)body+='<p class="lead">'+n.lead+'</p>';
  if(hasContent){
    if(n.contentUrl){
      body+='<div class="prose" id="topicContent"><p>Cargando contenido…</p></div>';
    } else {
      body+='<div class="prose">'+n.content+'</div>';
    }
  } else if(n.children&&n.children.length){
    body+='<div class="prose"><p>Esta sección agrupa los siguientes temas:</p></div>';
    body+='<div class="index-grid" style="margin-top:20px">';
    n.children.forEach((c,i)=>{
      const done=c.children?true:(c.content&&c.content.trim().length);
      const meta=c.children?c.children.length+' subtemas':(done?'Disponible':'Por desarrollar');
      body+='<div class="index-card" data-go="'+c.id+'">'
        +'<div class="ic-num">'+String(i+1).padStart(2,'0')+'</div>'
        +'<div class="ic-title">'+c.title+'</div>'
        +'<div class="ic-meta'+(done?'':' todo')+'">'+meta+'</div>'
        +'</div>';
    });
    body+='</div>';
  } else {
    body+='<div class="empty-note">Este tema todavía no tiene contenido.<br>Añádelo editando el campo <code>content</code> del nodo «'+n.id+'».</div>';
  }
  body+='</div>';
  rootEl.innerHTML=body;
  if(n.contentUrl){
    const holder = rootEl.querySelector('#topicContent');
    fetch(n.contentUrl)
      .then(r=>r.text())
      .then(html=>{ if(holder) holder.innerHTML = html; setupReveal(); })
      .catch(()=>{ if(holder) holder.innerHTML = '<div class="empty-note">No se pudo cargar el tema.</div>'; });
  }
  rootEl.querySelectorAll('[data-go]').forEach(el=>el.addEventListener('click',()=>{
    const t=el.dataset.go;t==='__home'?renderHome():navigate(t);
  }));
  staggerCards();
  setupReveal();
}

/* ── typing effect for hero ── */
const WORDS=['Glomerular','Tubular','Crónica','Aguda'];
let wordIdx=0,charIdx=0,deleting=false;
function typeLoop(el){
  const word=WORDS[wordIdx];
  if(!deleting){
    charIdx++;
    el.textContent=word.slice(0,charIdx);
    if(charIdx===word.length){deleting=true;setTimeout(()=>typeLoop(el),1600);return;}
  } else {
    charIdx--;
    el.textContent=word.slice(0,charIdx);
    if(charIdx===0){deleting=false;wordIdx=(wordIdx+1)%WORDS.length;}
  }
  setTimeout(()=>typeLoop(el),deleting?55:95);
}

function countNodes(nodes){
  let total=0;
  (function w(ns){ns.forEach(n=>{total++;if(n.children)w(n.children);});})(nodes);
  return total;
}

    +'<div class="hstat"><div class="num" id="sc-done">0</div><div class="lbl">Desarrollados</div></div>'
    +'</div></div>';

  /* cta banner */
  html+='<div class="cta-banner">'
    +'<h2>Selecciona un área y empieza a <span class="green">explorar el conocimiento</span></h2>'
    +'</div>';

  /* grid */
  html+='<div class="home-grid-section">'
    +'<div class="section-label">Todas las áreas</div>'
    +'<div class="index-grid">';
  TREE.forEach((n,i)=>{
    const meta=n.children?n.children.length+' temas':'Tema único';
    html+='<div class="index-card" data-go="'+n.id+'">'
      +'<div class="ic-num">'+String(i+1).padStart(2,'0')+'</div>'
      +'<div class="ic-title">'+n.title+'</div>'
      +'<div class="ic-meta">'+meta+'</div>'
      +'</div>';
  });
  html+='</div></div></div>';

  rootEl.innerHTML=html;
  rootEl.querySelectorAll('[data-go]').forEach(el=>el.addEventListener('click',()=>navigate(el.dataset.go)));
  staggerCards();
  renderTags();

  /* counters */
  animCount(document.getElementById('sc-areas'),TREE.length);
  animCount(document.getElementById('sc-total'),total);
  animCount(document.getElementById('sc-done'),withContent);

  /* typing */
  const tw=document.getElementById('typed-word');
  if(tw){tw.textContent='';setTimeout(()=>typeLoop(tw),800);}
}

  });
});
